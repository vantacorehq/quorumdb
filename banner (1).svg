<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>quorumdb banner</title>
<desc>Replicated key-value store with Raft consensus</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="300" fill="#0b0f14"/>
<rect width="1200" height="300" fill="url(#grid)"/>

<!-- 3 node cluster motif -->
<g stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.6">
  <line x1="150" y1="90" x2="150" y2="210"/>
  <line x1="150" y1="90" x2="60" y2="150"/>
  <line x1="150" y1="210" x2="60" y2="150"/>
</g>
<circle cx="150" cy="90" r="7" fill="#2dd4bf"/>
<circle cx="150" cy="210" r="7" fill="#64748b"/>
<circle cx="60" cy="150" r="7" fill="#64748b"/>
<text x="150" y="65" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="13">leader</text>
<text x="150" y="235" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13">follower</text>
<text x="40" y="150" text-anchor="end" fill="#64748b" font-family="monospace" font-size="13">follower</text>

<text x="420" y="150" fill="#f1f5f9" font-family="monospace" font-size="56" font-weight="700">quorumdb</text>
<text x="420" y="190" fill="#64748b" font-family="monospace" font-size="18">replicated kv store &#183; raft consensus &#183; crash-safe wal</text>

<rect x="420" y="215" width="92" height="26" rx="4" fill="none" stroke="#2dd4bf"/>
<text x="466" y="232" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="12">rust</text>
<rect x="522" y="215" width="150" height="26" rx="4" fill="none" stroke="#64748b"/>
<text x="597" y="232" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">zero dependencies</text>
<rect x="682" y="215" width="140" height="26" rx="4" fill="none" stroke="#64748b"/>
<text x="752" y="232" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">linearizable</text>
</svg>
